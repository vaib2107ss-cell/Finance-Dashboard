      const { symbol, rate } = CURRENCIES[curr] || CURRENCIES.USD;

      const absVal = Math.abs(converted);
      const isNegative = converted < 0;
      
      const formatted = new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(absVal);
      
      return `${isNegative ? '-' : ''}${symbol}${formatted}`;

      const [isCommandPaletteOpen, setIsCommandPaletteOpen] = useState(false);
      const [isTradeModalOpen, setIsTradeModalOpen] = useState(false);
      const [selectedTxnForModal, setSelectedTxnForModal] = useState(null);

        { id: 4, title: "Security Login Verification", desc: "Authorized token generated for automated reconciliation.", time: "2d ago", unread: false, type: "neutral" }
      ]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Keyboard Shortcut listener (Ctrl+K or Cmd+K)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            setIsCommandPaletteOpen(prev => !prev);
          }
          if (e.key === 'Escape') {
            setIsCommandPaletteOpen(false);
            setIsTransferModalOpen(false);
            setIsAddTxnModalOpen(false);
            setIsTradeModalOpen(false);
            setSelectedTxnForModal(null);
            setIsNotificationsOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Lucide Icons Refresh
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Simulated Real-Time Price Micro-Ticks
      useEffect(() => {
        if (!liveTickerActive) return;
        const interval = setInterval(() => {
          setHoldings(prev => prev.map(h => {
            if (h.type === 'Bond') return h;
            const deltaPct = (Math.random() - 0.48) * 0.4; // subtle change
            const newPrice = +(h.price * (1 + deltaPct / 100)).toFixed(2);
            const newValue = +(h.shares * newPrice).toFixed(2);

        setAccounts(prev => prev.map(acc => {
          if (acc.id === fromId) return { ...acc, balance: acc.balance - amt };
          if (acc.id === toId) return { ...acc, balance: acc.balance + amt };

        }));

            return h;

          showToast(`Executed SELL ${shares} ${symbol} for ${formatMoney(cost, currency)}!`);

          t.id,
          t.date,
          `"${t.desc.replace(/"/g, '""')}"`,
          `"${t.merchant.replace(/"/g, '""')}"`,
          t.category,
          `"${t.account}"`,
          t.amount,
          t.type,
          t.status,
          t.authCode || 'N/A'
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Apex_Treasury_Ledger_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();

    // --- DASHBOARD OVERVIEW VIEW ---
    function DashboardOverviewView({
      totalBalance,
      monthlyIncome,
      monthlyExpenses,
      netSavings,
      savingsRate,
      currency,
      timeRange,
      setTimeRange,
      chartType,
      setChartType,
      transactions,
      onSelectTransaction,
      onAddTxnClick,
      onTransferClick,
      accounts,
      selectedAccount,
      setSelectedAccount,
      onExportCSV
    }) {
      const [tableSearch, setTableSearch] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');

      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchSearch = t.desc.toLowerCase().includes(tableSearch.toLowerCase()) ||
                              t.merchant.toLowerCase().includes(tableSearch.toLowerCase()) ||
                              t.id.toLowerCase().includes(tableSearch.toLowerCase());
          const matchCategory = categoryFilter === 'All' || t.category === categoryFilter;
          const matchAccount = selectedAccount === 'all' || accounts.find(a => a.id === selectedAccount)?.name === t.account;
          return matchSearch && matchCategory && matchAccount;
        });
      }, [transactions, tableSearch, categoryFilter, selectedAccount, accounts]);

      return (
        <div className="space-y-6">

              </div>
              <p className="text-xs sm:text-sm text-slate-400 mt-1">
                Real-time multi-entity cash flow, burn rate monitoring, and automated ledger settlements.
              </p>
            </div>
            <div className="flex items-center gap-2.5 flex-wrap">
              <div className="flex items-center gap-1.5 bg-[#0B0F14] border border-[#1E2633] rounded-lg p-1 text-xs">
                <button
                  onClick={() => setSelectedAccount('all')}
                  className={`px-2.5 py-1 rounded-md transition-all font-medium ${selectedAccount === 'all' ? 'bg-[#1E2633] text-white' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  All Accounts
                </button>
                {accounts.map(acc => (
                  <button
                    key={acc.id}
                    onClick={() => setSelectedAccount(acc.id)}
                    className={`px-2.5 py-1 rounded-md transition-all font-medium ${selectedAccount === acc.id ? 'bg-[#1E2633] text-emerald-400' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    {acc.badge || acc.name.split(' ')[0]}
                  </button>
                ))}
              </div>

    function generateSparklinePoints(data, width, height) {
      if (!data || data.length === 0) return "";
      const min = Math.min(...data);
      const max = Math.max(...data);
      const range = max - min || 1;
      const step = width / (data.length - 1);

      return data.map((val, idx) => {
        const x = idx * step;
        const y = height - ((val - min) / range) * (height - 6) - 3;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
    }

    // --- CHART.JS INCOME VS EXPENSES ---
    function InteractiveIncomeExpenseChart({ period, type, currency }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !window.Chart) return;

        const dataObj = CASHFLOW_PERIODS[period] || CASHFLOW_PERIODS["7D"];
        const ctx = canvasRef.current.getContext('2d');

        const incomeGradient = ctx.createLinearGradient(0, 0, 0, 260);
        incomeGradient.addColorStop(0, 'rgba(16, 185, 129, 0.28)');
        incomeGradient.addColorStop(1, 'rgba(16, 185, 129, 0.00)');

        const expenseGradient = ctx.createLinearGradient(0, 0, 0, 260);
        expenseGradient.addColorStop(0, 'rgba(244, 63, 94, 0.22)');
        expenseGradient.addColorStop(1, 'rgba(244, 63, 94, 0.00)');

        if (chartInstanceRef.current) chartInstanceRef.current.destroy();

        const symbol = CURRENCIES[currency]?.symbol || '$';
        const rate = CURRENCIES[currency]?.rate || 1.0;

        chartInstanceRef.current = new window.Chart(ctx, {
          type: type === 'area' ? 'line' : 'bar',
          data: {
            labels: dataObj.labels,
            datasets: [
              {
                label: 'Inflow / Income',
                data: dataObj.income.map(v => v * rate),
                borderColor: '#10B981',
                backgroundColor: type === 'area' ? incomeGradient : 'rgba(16, 185, 129, 0.75)',
                borderWidth: 2.5,
                tension: 0.38,
                fill: type === 'area',
                pointBackgroundColor: '#10B981',
                pointBorderColor: '#0B0F14',
                pointBorderWidth: 2,
                pointRadius: 4,
                borderRadius: type === 'bar' ? 6 : 0,
              },
              {
                label: 'Outflow / Expenses',
                data: dataObj.expenses.map(v => v * rate),
                borderColor: '#F43F5E',
                backgroundColor: type === 'area' ? expenseGradient : 'rgba(244, 63, 94, 0.75)',
                borderWidth: 2.5,
                tension: 0.38,
                fill: type === 'area',
                pointBackgroundColor: '#F43F5E',
                pointBorderColor: '#0B0F14',
                pointBorderWidth: 2,
                pointRadius: 4,
                borderRadius: type === 'bar' ? 6 : 0,
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#11161F',
                borderColor: '#1E2633',
                borderWidth: 1,
                titleColor: '#F8FAFC',
                bodyColor: '#94A3B8',
                padding: 12,
                boxPadding: 6,
                usePointStyle: true,
                callbacks: {
                  label: function(context) {
                    let label = context.dataset.label || '';
                    if (label) label += ': ';
                    label += symbol + new Intl.NumberFormat('en-US', { minimumFractionDigits: 2 }).format(context.parsed.y);
                    return label;
                  }
                }
              }
            },
            scales: {
              x: {
                grid: { color: 'rgba(30, 38, 51, 0.4)', drawBorder: false },
                ticks: { color: '#64748B', font: { family: 'Plus Jakarta Sans', size: 11 } }
              },
              y: {
                grid: { color: 'rgba(30, 38, 51, 0.6)', drawBorder: false },
                ticks: {
                  color: '#64748B',
                  font: { family: 'JetBrains Mono', size: 10 },
                  callback: function(val) {
                    if (val >= 1000) return symbol + (val / 1000).toFixed(0) + 'k';
                    return symbol + val;
                  }
                }
              }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [period, type, currency]);

      return <canvas ref={canvasRef} className="w-full h-full"></canvas>;
    }

                    onChange={(e) => setCategory(e.target.value)}
                    disabled={type === 'income'}
                    className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                  >
                    <option value="Cloud & Tech">Cloud & Tech</option>
                    <option value="Software & SaaS">Software & SaaS</option>
                    <option value="Contractors & Payroll">Contractors & Payroll</option>
                    <option value="Marketing & Ads">Marketing & Ads</option>
                    <option value="Travel & Dining">Travel & Dining</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-300 block mb-1.5">Charged Account</label>
                  <select
                    value={account}
                    onChange={(e) => setAccount(e.target.value)}
                    className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                  >
                    {accounts.map(acc => (
                      <option key={acc.id} value={acc.name}>{acc.name}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="pt-3 border-t border-[#1E2633] flex items-center justify-end gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl bg-[#18202C] hover:bg-[#202B3B] text-xs font-semibold text-slate-300"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs shadow-md shadow-emerald-950/40"
                >
                  Add to Ledger
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- MODAL: TRANSACTION DETAIL / RECEIPT ---
    function TransactionDetailModal({ txn, currency, onClose, showToast }) {
      const isIncome = txn.type === 'income';

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
          <div className="w-full max-w-md bg-[#11161F] border border-[#1E2633] rounded-2xl shadow-modal overflow-hidden">
            <div className="p-5 border-b border-[#1E2633] flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <span className="text-xs font-mono text-emerald-400 font-semibold px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20">
                  {txn.id}
                </span>
                <span className="text-xs font-bold text-white">Audited Settlement Record</span>
              </div>
              <button onClick={onClose} className="h-7 w-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-white hover:bg-[#1E2633]">
                <i data-lucide="x" className="w-4 h-4"></i>
              </button>
            </div>

            <div className="p-6 space-y-5">
              <div className="text-center py-3 bg-[#0B0F14] rounded-2xl border border-[#1E2633]">
                <span className="text-[10px] font-mono uppercase text-slate-400">Total Cleared Value</span>
                <h3 className={`text-3xl font-mono font-extrabold mt-1 ${isIncome ? 'text-emerald-400' : 'text-slate-100'}`}>
                  {isIncome ? '+' : ''}{formatMoney(txn.amount, currency)}
                </h3>
                <span className="inline-flex items-center gap-1.5 px-2 py-0.5 mt-2 rounded text-[10px] font-mono font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                  <span className="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
                  Reconciled & Cleared
                </span>
              </div>

              <div className="space-y-2.5 text-xs">
                <div className="flex justify-between py-1.5 border-b border-[#1E2633]/60">
                  <span className="text-slate-400">Description</span>
                  <span className="font-semibold text-slate-200 text-right">{txn.desc}</span>
                </div>
                <div className="flex justify-between py-1.5 border-b border-[#1E2633]/60">
                  <span className="text-slate-400">Counterparty Merchant</span>
                  <span className="font-mono text-slate-200">{txn.merchant}</span>
                </div>
                <div className="flex justify-between py-1.5 border-b border-[#1E2633]/60">
                  <span className="text-slate-400">Category Tag</span>
                  <span className="text-slate-200">{txn.category}</span>
                </div>
                <div className="flex justify-between py-1.5 border-b border-[#1E2633]/60">
                  <span className="text-slate-400">Treasury Account</span>
                  <span className="font-mono text-slate-200">{txn.account}</span>
                </div>
                <div className="flex justify-between py-1.5 border-b border-[#1E2633]/60">
                  <span className="text-slate-400">Clearing Timestamp</span>
                  <span className="font-mono text-slate-400">{txn.date} 14:22:59 UTC</span>
                </div>
                <div className="flex justify-between py-1.5 border-b border-[#1E2633]/60">
                  <span className="text-slate-400">Authorization Code</span>
                  <span className="font-mono text-emerald-400">{txn.authCode || 'AUTH-99214'}</span>
                </div>
              </div>

              <div className="pt-2 flex gap-2">
                <button
                  onClick={() => {
                    showToast(`Receipt PDF for ${txn.id} generated and downloaded.`);
                    onClose();
                  }}
                  className="flex-1 py-2.5 rounded-xl bg-[#18202C] hover:bg-[#202B3B] text-xs font-semibold text-slate-200 flex items-center justify-center gap-1.5 border border-[#1E2633]"
                >
                  <i data-lucide="file-text" className="w-3.5 h-3.5"></i>
                  Download Receipt
                </button>
                <button
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs"
                >
                  Done
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- COMMAND PALETTE MODAL ---
    function CommandPaletteModal({ onClose, onNavigate, onAction }) {
      const [search, setSearch] = useState('');

      const commands = [
        { id: 'view-dash', label: 'Go to Dashboard Overview', category: 'Navigation', icon: 'layout-dashboard', action: () => onNavigate('dashboard') },
        { id: 'view-txns', label: 'View All Transactions Ledger', category: 'Navigation', icon: 'arrow-left-right', action: () => onNavigate('transactions') },
        { id: 'view-cards', label: 'Manage Corporate Cards & Limits', category: 'Navigation', icon: 'credit-card', action: () => onNavigate('cards') },
        { id: 'view-analytics', label: 'Open Analytics & Burn Runway', category: 'Navigation', icon: 'bar-chart-3', action: () => onNavigate('analytics') },
        { id: 'view-inv', label: 'Open Investments Portfolio', category: 'Navigation', icon: 'pie-chart', action: () => onNavigate('investments') },
        { id: 'view-set', label: 'Open Workspace Settings', category: 'Navigation', icon: 'settings', action: () => onNavigate('settings') },
        { id: 'act-transfer', label: 'Transfer Money Between Vaults', category: 'Actions', icon: 'send', action: () => onAction('transfer') },
        { id: 'act-add', label: 'Record New Transaction / Spend', category: 'Actions', icon: 'plus-circle', action: () => onAction('add-txn') },
        { id: 'act-trade', label: 'Execute Asset Trade / Order', category: 'Actions', icon: 'trending-up', action: () => onAction('trade') },
        { id: 'act-export', label: 'Export Complete CSV Ledger', category: 'Actions', icon: 'download', action: () => onAction('export-csv') },
      ];

      const filtered = commands.filter(c => c.label.toLowerCase().includes(search.toLowerCase()));

      return (
        <div className="fixed inset-0 z-50 flex items-start justify-center pt-20 p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
          <div className="w-full max-w-lg bg-[#11161F] border border-[#1E2633] rounded-2xl shadow-modal overflow-hidden">
            <div className="flex items-center gap-3 px-4 py-3.5 border-b border-[#1E2633]">
              <i data-lucide="search" className="w-4 h-4 text-emerald-400"></i>
              <input
                type="text"
                autoFocus
                placeholder="Type a command or jump to page..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="w-full bg-transparent text-sm text-white placeholder-slate-500 focus:outline-none"
              />
              <kbd className="px-2 py-0.5 text-[10px] font-mono bg-[#1E2633] text-slate-400 rounded">ESC</kbd>
            </div>

            <div className="max-h-80 overflow-y-auto p-2 space-y-1">
              {filtered.map(cmd => (
                <div
                  key={cmd.id}
                  onClick={cmd.action}
                  className="flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-[#18202C] transition-colors cursor-pointer group"
                >
                  <div className="flex items-center gap-3">
                    <div className="h-7 w-7 rounded-lg bg-[#0B0F14] border border-[#1E2633] flex items-center justify-center text-slate-400 group-hover:text-emerald-400">
                      <i data-lucide={cmd.icon} className="w-3.5 h-3.5"></i>
                    </div>
                    <span className="text-xs font-semibold text-slate-200 group-hover:text-white">{cmd.label}</span>
                  </div>
                  <span className="text-[10px] font-mono text-slate-500">{cmd.category}</span>
                </div>
              ))}
              {filtered.length === 0 && (
                <div className="py-6 text-center text-xs text-slate-500">
                  No matching actions found for "{search}"
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- MOUNT APPLICATION ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FinanceDashboardApp />);
  </script>
</body>
</html>
