    // --- INDIAN RUPEE (₹) NUMBER FORMATTER ---
    function formatINR(amount, formatType = 'standard') {
      const absVal = Math.abs(amount);
      const isNegative = amount < 0;
      const sign = isNegative ? '-' : '';

      if (formatType === 'compact') {
        if (absVal >= 10000000) {
          return `${sign}₹${(absVal / 10000000).toFixed(2)} Cr`;
        }
        if (absVal >= 100000) {
          return `${sign}₹${(absVal / 100000).toFixed(2)} Lakh`;
        }
        if (absVal >= 1000) {
          return `${sign}₹${(absVal / 1000).toFixed(1)}k`;
        }
      }

      // Standard Indian Numbering System: 1,23,456.78
      return `${sign}₹${new Intl.NumberFormat('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(absVal)}`;
    }

          return acc;

        const fromAcc = accounts.find(a => a.id === fromId);
        const toAcc = accounts.find(a => a.id === toId);

        const newTxn = {
          id: `TXN-${Math.floor(1000 + Math.random() * 9000)}`,

          time: "Just now",
          desc: `Internal Transfer: ${fromAcc?.name} → ${toAcc?.name}`,
          merchant: "Self Liquidity Transfer",
          category: "Transfer",
          account: fromAcc?.name || "HDFC Salary & Primary",
          amount: -amt,
          type: "expense",
          status: "Completed",
          icon: "ArrowRightLeft",
          authCode: `IMPS-IN${Math.floor(10000 + Math.random() * 90000)}`
        };

        setTransactions([newTxn, ...transactions]);
        showToast(`Successfully transferred ${formatINR(amt)} to ${toAcc?.name}!`);
        setIsTransferModalOpen(false);
      };

      // Handle Trade Execution
      const handleTrade = ({ symbol, action, shares, price, total }) => {
        const cost = parseFloat(total);
        if (action === 'BUY') {
          setAccounts(prev => prev.map(a => a.id === 'acc-1' ? { ...a, balance: a.balance - cost } : a));
          setHoldings(prev => {
            const exists = prev.find(h => h.symbol === symbol);
            if (exists) {
              const newShares = exists.shares + parseFloat(shares);
              const newAvg = +(((exists.shares * exists.avg) + cost) / newShares).toFixed(2);
              const newValue = +(newShares * exists.price).toFixed(2);
              const newPnl = +(newValue - (newShares * newAvg)).toFixed(2);
              const newPnlPct = +((newPnl / (newShares * newAvg)) * 100).toFixed(2);
              return prev.map(h => h.symbol === symbol ? { ...h, shares: newShares, avg: newAvg, value: newValue, pnl: newPnl, pnlPct: newPnlPct } : h);
            }
            return prev;
          });
          showToast(`Executed BUY ${shares} units of ${symbol} for ${formatINR(cost)}!`);
        } else {
          setAccounts(prev => prev.map(a => a.id === 'acc-1' ? { ...a, balance: a.balance + cost } : a));
          setHoldings(prev => prev.map(h => {
            if (h.symbol === symbol) {
              const newShares = Math.max(0, h.shares - parseFloat(shares));
              const newValue = +(newShares * h.price).toFixed(2);
              const newPnl = +(newValue - (newShares * h.avg)).toFixed(2);
              const newPnlPct = newShares > 0 ? +((newPnl / (newShares * h.avg)) * 100).toFixed(2) : 0;
              return { ...h, shares: newShares, value: newValue, pnl: newPnl, pnlPct: newPnlPct };
            }
            return h;
          }));
          showToast(`Executed SELL ${shares} units of ${symbol} for ${formatINR(cost)}!`);
        }
        setIsTradeModalOpen(false);
      };

      // Toggle Card Freeze
      const handleToggleFreezeCard = (cardId) => {
        setCards(prev => prev.map(c => {
          if (c.id === cardId) {
            const nextState = !c.isFrozen;
            showToast(`${c.name} ${nextState ? 'Frozen & Locked' : 'Active & Unfrozen'}`);
            return { ...c, isFrozen: nextState };

          return c;
        }));

      // Export CSV
      const handleExportCSV = () => {
        const headers = ["Transaction ID", "Date", "Description", "Merchant", "Category", "Account", "Amount (INR)", "Type", "Status", "Auth Code"];
        const rows = transactions.map(t => [
          t.id,
          t.date,
          `"${t.desc.replace(/"/g, '""')}"`,
          `"${t.merchant.replace(/"/g, '""')}"`,
          t.category,
          `"${t.account}"`,
          t.amount,
          t.type,
          t.status,
          t.authCode || 'N/A'

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");

        link.click();

    // --- DASHBOARD OVERVIEW VIEW (CASHXFLOW MAIN) ---
    function DashboardOverviewView({

      netCashFlow,
      savingsRate,
      cashFlowRange,
      setCashFlowRange,
      chartType,
      setChartType,
      transactions,
      onSelectTransaction,
      onAddTxnClick,
      onTransferClick,
      accounts,
      selectedAccount,
      setSelectedAccount,
      onExportCSV,
      showToast

      const [tableSearch, setTableSearch] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const dynamicGreeting = getDynamicGreeting("Vaibhav");

      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchSearch = t.desc.toLowerCase().includes(tableSearch.toLowerCase()) ||

    function generateSparklinePoints(data, width, height) {
      if (!data || data.length === 0) return "";
      const min = Math.min(...data);
      const max = Math.max(...data);
      const range = max - min || 1;
      const step = width / (data.length - 1);

      return data.map((val, idx) => {
        const x = idx * step;
        const y = height - ((val - min) / range) * (height - 6) - 3;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
    }

    // --- CHART.JS: 3-SERIES CASH FLOW (Income vs Expenses vs Net) ---

      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !window.Chart) return;
        const dataObj = CASHFLOW_PERIODS[period] || CASHFLOW_PERIODS["6M"];
        const ctx = canvasRef.current.getContext('2d');

        const incomeGrad = ctx.createLinearGradient(0, 0, 0, 240);
        incomeGrad.addColorStop(0, 'rgba(16, 185, 129, 0.28)');
        incomeGrad.addColorStop(1, 'rgba(16, 185, 129, 0.00)');

        const expenseGrad = ctx.createLinearGradient(0, 0, 0, 240);
        expenseGrad.addColorStop(0, 'rgba(244, 63, 94, 0.22)');
        expenseGrad.addColorStop(1, 'rgba(244, 63, 94, 0.00)');

                  value={symbol}

                  className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-mono"
                >
                  {holdings.map(h => (
                    <option key={h.symbol} value={h.symbol}>
                      {h.symbol} — {h.name} (₹{h.price.toFixed(2)})
                    </option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold text-slate-300 block mb-1.5">Quantity / Units</label>
                  <input
                    type="number"
                    step="any"
                    value={shares}
                    onChange={(e) => setShares(e.target.value)}
                    required
                    className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white font-mono font-bold focus:outline-none focus:border-emerald-500"
                  />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-300 block mb-1.5">Price (INR)</label>
                  <input
                    type="text"
                    disabled
                    value={`₹${selectedAsset?.price?.toFixed(2)}`}
                    className="w-full bg-[#0B0F14]/60 border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-slate-400 font-mono"
                  />
                </div>
              </div>

              <div className="p-3 bg-[#0B0F14] rounded-xl border border-[#1E2633] flex justify-between items-center text-xs">
                <span className="text-slate-400 font-medium">Estimated Order Value:</span>
                <span className="font-mono font-extrabold text-white text-sm">
                  {formatINR(estimatedTotal)}
                </span>
              </div>

              <div className="pt-3 border-t border-[#1E2633] flex items-center justify-end gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl bg-[#18202C] hover:bg-[#202B3B] text-xs font-semibold text-slate-300"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className={`px-4 py-2 rounded-xl text-slate-950 font-bold text-xs shadow-md ${
                    action === 'BUY' ? 'bg-emerald-500 hover:bg-emerald-400' : 'bg-rose-500 hover:bg-rose-400 text-white'
                  }`}
                >
                  Confirm {action} Order
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- MODAL: TRANSFER MONEY ---
    function TransferModal({ accounts, onClose, onTransfer }) {
      const [fromId, setFromId] = useState(accounts[0]?.id || '');
      const [toId, setToId] = useState(accounts[1]?.id || '');
      const [amount, setAmount] = useState('');
      const [note, setNote] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (fromId === toId) {
          alert("Source and destination accounts must be different.");
          return;
        }
        if (!amount || parseFloat(amount) <= 0) {
          alert("Please enter a valid transfer amount.");
          return;
        }
        onTransfer({ fromId, toId, amount, note });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm animate-fade-in">
          <div className="w-full max-w-md bg-[#11161F] border border-[#1E2633] rounded-2xl shadow-modal overflow-hidden">
            <div className="flex items-center justify-between p-5 border-b border-[#1E2633]">
              <div className="flex items-center gap-2.5">
                <div className="h-8 w-8 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center">
                  <i data-lucide="arrow-right-left" className="w-4 h-4"></i>
                </div>
                <div>
                  <h3 className="text-sm font-bold text-white">Instant IMPS / Internal Move</h3>
                  <p className="text-[11px] text-slate-400">Zero fee instant bank-to-bank liquidity transfer</p>
                </div>
              </div>
              <button onClick={onClose} className="h-7 w-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-white hover:bg-[#1E2633]">
                <i data-lucide="x" className="w-4 h-4"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 space-y-4">
              <div>
                <label className="text-xs font-semibold text-slate-300 block mb-1.5">Source Account (From)</label>
                <select
                  value={fromId}
                  onChange={(e) => setFromId(e.target.value)}
                  className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-mono"
                >
                  {accounts.map(acc => (
                    <option key={acc.id} value={acc.id}>
                      {acc.name} — Balance: {formatINR(acc.balance)}
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-300 block mb-1.5">Destination Account (To)</label>
                <select
                  value={toId}
                  onChange={(e) => setToId(e.target.value)}
                  className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-mono"
                >
                  {accounts.map(acc => (
                    <option key={acc.id} value={acc.id} disabled={acc.id === fromId}>
                      {acc.name} — Balance: {formatINR(acc.balance)}
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-300 block mb-1.5">Transfer Amount (INR ₹)</label>
                <div className="relative">
                  <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-mono">₹</span>
                  <input
                    type="number"
                    step="0.01"
                    placeholder="0.00"
                    value={amount}
                    onChange={(e) => setAmount(e.target.value)}
                    required
                    className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl pl-8 pr-4 py-2.5 text-sm text-white font-mono font-bold focus:outline-none focus:border-emerald-500"
                  />
                </div>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-300 block mb-1.5">Transfer Memo / Purpose</label>
                <input
                  type="text"
                  placeholder="e.g. Sweep deposit top-up or SIP buffer"
                  value={note}
                  onChange={(e) => setNote(e.target.value)}
                  className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                />
              </div>

              <div className="pt-3 border-t border-[#1E2633] flex items-center justify-end gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl bg-[#18202C] hover:bg-[#202B3B] text-xs font-semibold text-slate-300"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs shadow-md shadow-emerald-950/40"
                >
                  Confirm Instant Transfer
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- MODAL: ADD TRANSACTION ---
    function AddTransactionModal({ accounts, onClose, onAdd }) {
      const [desc, setDesc] = useState('');
      const [merchant, setMerchant] = useState('');
      const [category, setCategory] = useState('Bills & Utilities');
      const [account, setAccount] = useState(accounts[0]?.name || 'HDFC Salary & Primary');
      const [amount, setAmount] = useState('');
      const [type, setType] = useState('expense');

      const handleSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(amount);
        if (!amt || amt <= 0) return;

        const newTxn = {
          id: `TXN-${Math.floor(1000 + Math.random() * 9000)}`,
          date: "Aug 31, 2026",
          time: "Just now",
          desc: desc || (type === 'income' ? 'Client Remittance' : 'Operating Expense'),
          merchant: merchant || 'CASHXFLOW Verified Counterparty',
          category: type === 'income' ? 'Income' : category,
          account: account,
          amount: type === 'income' ? amt : -amt,
          type: type,
          status: "Completed",
          icon: type === 'income' ? 'ArrowDownLeft' : 'CreditCard',
          authCode: `UPI-${Math.floor(10000 + Math.random() * 90000)}`
        };

        onAdd(newTxn);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm animate-fade-in">
          <div className="w-full max-w-md bg-[#11161F] border border-[#1E2633] rounded-2xl shadow-modal overflow-hidden">
            <div className="flex items-center justify-between p-5 border-b border-[#1E2633]">
              <div className="flex items-center gap-2.5">
                <div className="h-8 w-8 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center">
                  <i data-lucide="plus-circle" className="w-4 h-4"></i>
                </div>
                <div>
                  <h3 className="text-sm font-bold text-white">Record Transaction (INR ₹)</h3>
                  <p className="text-[11px] text-slate-400">Direct manual ledger entry</p>
                </div>
              </div>
              <button onClick={onClose} className="h-7 w-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-white hover:bg-[#1E2633]">
                <i data-lucide="x" className="w-4 h-4"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 space-y-4">
              <div className="grid grid-cols-2 gap-2 p-1 bg-[#0B0F14] rounded-xl border border-[#1E2633]">
                <button
                  type="button"
                  onClick={() => setType('expense')}
                  className={`py-1.5 rounded-lg text-xs font-bold transition-all ${
                    type === 'expense' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'text-slate-400'
                  }`}
                >
                  Expense Outflow
                </button>
                <button
                  type="button"
                  onClick={() => setType('income')}
                  className={`py-1.5 rounded-lg text-xs font-bold transition-all ${
                    type === 'income' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'text-slate-400'
                  }`}
                >
                  Income Inflow
                </button>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-300 block mb-1.5">Description</label>
                <input
                  type="text"
                  placeholder="e.g. AWS Cloud Server or Client Remittance"
                  value={desc}
                  onChange={(e) => setDesc(e.target.value)}
                  required
                  className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold text-slate-300 block mb-1.5">Counterparty / Merchant</label>
                  <input
                    type="text"
                    placeholder="e.g. Swiggy, AWS India"
                    value={merchant}
                    onChange={(e) => setMerchant(e.target.value)}
                    className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                  />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-300 block mb-1.5">Amount (₹ INR)</label>
                  <input
                    type="number"
                    step="0.01"
                    placeholder="0.00"
                    value={amount}
                    onChange={(e) => setAmount(e.target.value)}
                    required
                    className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white font-mono font-bold focus:outline-none focus:border-emerald-500"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold text-slate-300 block mb-1.5">Category</label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    disabled={type === 'income'}
                    className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                  >
                    <option value="Bills & Utilities">Bills & Utilities</option>
                    <option value="Food & Groceries">Food & Groceries</option>
                    <option value="Shopping & Lifestyle">Shopping & Lifestyle</option>
                    <option value="Travel & Commute">Travel & Commute</option>
                    <option value="Investments">Investments</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other & Health">Other & Health</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-300 block mb-1.5">Charged Account</label>
                  <select
                    value={account}
                    onChange={(e) => setAccount(e.target.value)}
                    className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                  >
                    {accounts.map(acc => (
                      <option key={acc.id} value={acc.name}>{acc.name}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="pt-3 border-t border-[#1E2633] flex items-center justify-end gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl bg-[#18202C] hover:bg-[#202B3B] text-xs font-semibold text-slate-300"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs shadow-md shadow-emerald-950/40"
                >
                  Add to Ledger
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- MODAL: TRANSACTION DETAIL / RECEIPT ---
    function TransactionDetailModal({ txn, onClose, showToast }) {
      const isIncome = txn.type === 'income';

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
          <div className="w-full max-w-md bg-[#11161F] border border-[#1E2633] rounded-2xl shadow-modal overflow-hidden">
            <div className="p-5 border-b border-[#1E2633] flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <span className="text-xs font-mono text-emerald-400 font-semibold px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20">
                  {txn.id}
                </span>
                <span className="text-xs font-bold text-white">Audited Settlement Record</span>
              </div>
              <button onClick={onClose} className="h-7 w-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-white hover:bg-[#1E2633]">
                <i data-lucide="x" className="w-4 h-4"></i>
              </button>
            </div>

            <div className="p-6 space-y-5">
              <div className="text-center py-3 bg-[#0B0F14] rounded-2xl border border-[#1E2633]">
                <span className="text-[10px] font-mono uppercase text-slate-400">Total Cleared Value</span>
                <h3 className={`text-3xl font-mono font-extrabold mt-1 ${isIncome ? 'text-emerald-400' : 'text-slate-100'}`}>
                  {isIncome ? '+' : ''}{formatINR(txn.amount)}
                </h3>
                <span className="inline-flex items-center gap-1.5 px-2 py-0.5 mt-2 rounded text-[10px] font-mono font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                  <span className="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
                  Reconciled & Cleared
                </span>
              </div>

              <div className="space-y-2.5 text-xs">
                <div className="flex justify-between py-1.5 border-b border-[#1E2633]/60">
                  <span className="text-slate-400">Description</span>
                  <span className="font-semibold text-slate-200 text-right">{txn.desc}</span>
                </div>
                <div className="flex justify-between py-1.5 border-b border-[#1E2633]/60">
                  <span className="text-slate-400">Merchant / Entity</span>
                  <span className="font-mono text-slate-200">{txn.merchant}</span>
                </div>
                <div className="flex justify-between py-1.5 border-b border-[#1E2633]/60">
                  <span className="text-slate-400">Category</span>
                  <span className="text-slate-200">{txn.category}</span>
                </div>
                <div className="flex justify-between py-1.5 border-b border-[#1E2633]/60">
                  <span className="text-slate-400">Bank Account</span>
                  <span className="font-mono text-slate-200">{txn.account}</span>
                </div>
                <div className="flex justify-between py-1.5 border-b border-[#1E2633]/60">
                  <span className="text-slate-400">Clearing Time</span>
                  <span className="font-mono text-slate-400">{txn.date} {txn.time || '14:22 IST'}</span>
                </div>
                <div className="flex justify-between py-1.5 border-b border-[#1E2633]/60">
                  <span className="text-slate-400">Reference / Auth Code</span>
                  <span className="font-mono text-emerald-400">{txn.authCode || 'IMPS-99214'}</span>
                </div>
              </div>

              <div className="pt-2 flex gap-2">
                <button
                  onClick={() => {
                    showToast(`Receipt for ${txn.id} generated and downloaded.`);
                    onClose();
                  }}
                  className="flex-1 py-2.5 rounded-xl bg-[#18202C] hover:bg-[#202B3B] text-xs font-semibold text-slate-200 flex items-center justify-center gap-1.5 border border-[#1E2633]"
                >
                  <i data-lucide="file-text" className="w-3.5 h-3.5"></i>
                  Download Receipt
                </button>
                <button
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs"
                >
                  Done
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- COMMAND PALETTE MODAL ---
    function CommandPaletteModal({ onClose, onNavigate, onAction }) {
      const [search, setSearch] = useState('');

      const commands = [
        { id: 'view-dash', label: 'Go to Dashboard Overview', category: 'Navigation', icon: 'layout-dashboard', action: () => onNavigate('dashboard') },
        { id: 'view-txns', label: 'View All Transactions Ledger', category: 'Navigation', icon: 'arrow-left-right', action: () => onNavigate('transactions') },
        { id: 'view-cards', label: 'Manage Corporate Cards & Limits', category: 'Navigation', icon: 'credit-card', action: () => onNavigate('cards') },
        { id: 'view-analytics', label: 'Open Analytics & Burn Runway', category: 'Navigation', icon: 'bar-chart-3', action: () => onNavigate('analytics') },
        { id: 'view-inv', label: 'Open Investments & SIPs', category: 'Navigation', icon: 'pie-chart', action: () => onNavigate('investments') },
        { id: 'view-set', label: 'Open Workspace Settings', category: 'Navigation', icon: 'settings', action: () => onNavigate('settings') },
        { id: 'act-transfer', label: 'Transfer Money Between Accounts', category: 'Actions', icon: 'send', action: () => onAction('transfer') },
        { id: 'act-add', label: 'Record New Transaction / Spend', category: 'Actions', icon: 'plus-circle', action: () => onAction('add-txn') },
        { id: 'act-trade', label: 'Execute Stock / ETF Trade', category: 'Actions', icon: 'trending-up', action: () => onAction('trade') },
        { id: 'act-export', label: 'Export Complete CSV Ledger', category: 'Actions', icon: 'download', action: () => onAction('export-csv') },
      ];

      const filtered = commands.filter(c => c.label.toLowerCase().includes(search.toLowerCase()));

      return (
        <div className="fixed inset-0 z-50 flex items-start justify-center pt-20 p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
          <div className="w-full max-w-lg bg-[#11161F] border border-[#1E2633] rounded-2xl shadow-modal overflow-hidden">
            <div className="flex items-center gap-3 px-4 py-3.5 border-b border-[#1E2633]">
              <i data-lucide="search" className="w-4 h-4 text-emerald-400"></i>
              <input
                type="text"
                autoFocus
                placeholder="Type a command or jump to page..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="w-full bg-transparent text-sm text-white placeholder-slate-500 focus:outline-none"
              />
              <kbd className="px-2 py-0.5 text-[10px] font-mono bg-[#1E2633] text-slate-400 rounded">ESC</kbd>
            </div>

            <div className="max-h-80 overflow-y-auto p-2 space-y-1">
              {filtered.map(cmd => (
                <div
                  key={cmd.id}
                  onClick={cmd.action}
                  className="flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-[#18202C] transition-colors cursor-pointer group"
                >
                  <div className="flex items-center gap-3">
                    <div className="h-7 w-7 rounded-lg bg-[#0B0F14] border border-[#1E2633] flex items-center justify-center text-slate-400 group-hover:text-emerald-400">
                      <i data-lucide={cmd.icon} className="w-3.5 h-3.5"></i>
                    </div>
                    <span className="text-xs font-semibold text-slate-200 group-hover:text-white">{cmd.label}</span>
                  </div>
                  <span className="text-[10px] font-mono text-slate-500">{cmd.category}</span>
                </div>
              ))}
              {filtered.length === 0 && (
                <div className="py-6 text-center text-xs text-slate-500">
                  No matching actions found for "{search}"
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- MOUNT REACT APP ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CashXFlowApp />);
  </script>
</body>
</html>
