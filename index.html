    // --- CURRENCY & NUMBER FORMATTER (INR ₹ with Fallbacks) ---
    function formatMoney(amount, currency = 'INR', formatType = 'standard') {
      const absVal = Math.abs(amount);
      const isNegative = amount < 0;
      const sign = isNegative ? '-' : '';

      if (currency === 'INR') {
        if (formatType === 'compact') {
          if (absVal >= 10000000) return `${sign}₹${(absVal / 10000000).toFixed(2)} Cr`;
          if (absVal >= 100000) return `${sign}₹${(absVal / 100000).toFixed(2)} Lakh`;
          if (absVal >= 1000) return `${sign}₹${(absVal / 1000).toFixed(1)}k`;
        }
        return `${sign}₹${new Intl.NumberFormat('en-IN', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(absVal)}`;
      } else {
        const symbol = currency === 'USD' ? '$' : currency === 'EUR' ? '€' : currency === 'GBP' ? '£' : '$';
        if (formatType === 'compact' && absVal >= 1000) return `${sign}${symbol}${(absVal / 1000).toFixed(1)}k`;
        return `${sign}${symbol}${new Intl.NumberFormat('en-US', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(absVal)}`;
      }
    }

      const [isCsvImportModalOpen, setIsCsvImportModalOpen] = useState(false);
      const [isTradeModalOpen, setIsTradeModalOpen] = useState(false);
      const [isAiChatOpen, setIsAiChatOpen] = useState(false);
      const [isCommandPaletteOpen, setIsCommandPaletteOpen] = useState(false);
      const [selectedTxnForModal, setSelectedTxnForModal] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      // AI Chat State
      const [aiMessages, setAiMessages] = useState([
        { sender: 'ai', text: 'Hello! I am your CASHXFLOW Smart Financial Copilot. Ask me anything about your current spending, savings rate, or where you can optimize cash flow.' }
      ]);
      const [aiInput, setAiInput] = useState('');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Active User's Data Slice
      const activeAccounts = useMemo(() => {
        return currentUser ? (accountsByUser[currentUser.id] || []) : [];
      }, [currentUser, accountsByUser]);

      const activeTransactions = useMemo(() => {
        return currentUser ? (transactionsByUser[currentUser.id] || []) : [];
      }, [currentUser, transactionsByUser]);

      const activeHoldings = useMemo(() => {
        return currentUser ? (holdingsByUser[currentUser.id] || []) : [];
      }, [currentUser, holdingsByUser]);

      // Dynamic Financial Calculations for the Logged-In User
      const totalBalance = useMemo(() => {
        return activeAccounts.reduce((sum, a) => sum + a.balance, 0);
      }, [activeAccounts]);

      const totalInvestments = useMemo(() => {
        return activeHoldings.reduce((sum, h) => sum + h.value, 0);
      }, [activeHoldings]);

      const netWorth = useMemo(() => {
        return totalBalance + totalInvestments;
      }, [totalBalance, totalInvestments]);

      const monthlyIncome = useMemo(() => {
        return activeTransactions
          .filter(t => t.type === 'income' && t.status === 'Completed')
          .reduce((sum, t) => sum + t.amount, 0);
      }, [activeTransactions]);

      const monthlyExpenses = useMemo(() => {
        return activeTransactions
          .filter(t => t.type === 'expense' && t.status === 'Completed')
          .reduce((sum, t) => sum + Math.abs(t.amount), 0);
      }, [activeTransactions]);

      const netCashFlow = monthlyIncome - monthlyExpenses;
      const savingsRate = monthlyIncome > 0 ? +((netCashFlow / monthlyIncome) * 100).toFixed(1) : 0;

      // Dynamic Category Breakdown from Real Transactions
      const spendingCategories = useMemo(() => {
        const catMap = {};
        const colors = ["#3B82F6", "#10B981", "#8B5CF6", "#06B6D4", "#F59E0B", "#EC4899", "#64748B"];
        let colorIdx = 0;

        activeTransactions.filter(t => t.type === 'expense').forEach(t => {
          catMap[t.category] = (catMap[t.category] || 0) + Math.abs(t.amount);
        });

        const totalExpense = monthlyExpenses || 1;
        return Object.keys(catMap).map(catName => {
          const amt = catMap[catName];
          const pct = +((amt / totalExpense) * 100).toFixed(1);
          const item = {
            name: catName,
            amount: amt,
            percentage: pct,
            color: colors[colorIdx % colors.length]
          };
          colorIdx++;
          return item;
        }).sort((a, b) => b.amount - a.amount);
      }, [activeTransactions, monthlyExpenses]);

      // Dynamic Financial Health Score (0 - 100)
      const healthScore = useMemo(() => {
        let score = 70;
        if (savingsRate >= 50) score += 15;
        else if (savingsRate >= 30) score += 10;
        else if (savingsRate < 10) score -= 15;

        if (totalBalance > monthlyExpenses * 6) score += 10;
        if (totalInvestments > 0) score += 5;
        return Math.min(99, Math.max(42, score));
      }, [savingsRate, totalBalance, monthlyExpenses, totalInvestments]);

      // Auto initialize Lucide icons
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Quick switch user
      const handleSwitchUser = (userId) => {
        const target = users.find(u => u.id === userId);
        if (target) {
          setCurrentUser(target);
          setSelectedAccount('all');
          setUserSwitcherOpen(false);
          showToast(`Switched workspace to ${target.name}`);

    // --- CSV IMPORT MODAL COMPONENT ---
    function CsvImportModal({ onClose, onImport, currency }) {
      const [csvText, setCsvText] = useState('');
      const [parsedPreview, setParsedPreview] = useState([]);
      const fileInputRef = useRef(null);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const content = event.target.result;
          setCsvText(content);
          parseCSV(content);
        };
        reader.readAsText(file);
      };

      const parseCSV = (text) => {
        const lines = text.trim().split('\n');
        if (lines.length < 2) return;
        const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
        const rows = [];

        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;
          const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
          const rowObj = {};
          headers.forEach((h, idx) => {
            rowObj[h] = cols[idx] || '';
          });
          rows.push(rowObj);
        }

        setParsedPreview(rows);
      };

      const handleConfirm = () => {
        if (parsedPreview.length === 0) {
          alert("Please upload or paste CSV data first.");
          return;
        }
        onImport(parsedPreview);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
          <div className="w-full max-w-lg bg-[#11161F] border border-[#1E2633] rounded-3xl shadow-modal overflow-hidden">
            <div className="p-5 border-b border-[#1E2633] flex items-center justify-between bg-[#0E131A]">
              <div className="flex items-center gap-2.5">
                <div className="h-8 w-8 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center">
                  <i data-lucide="upload" className="w-4 h-4"></i>
                </div>
                <div>
                  <h3 className="text-sm font-bold text-white">Import Bank CSV Transactions</h3>
                  <p className="text-[11px] text-slate-400">Upload statement from HDFC, ICICI, Zerodha, etc.</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <i data-lucide="x" className="w-4 h-4"></i>
              </button>
            </div>

            <div className="p-6 space-y-4">
              {/* File Upload Box */}
              <div 
                onClick={() => fileInputRef.current?.click()}
                className="border-2 border-dashed border-[#1E2633] hover:border-emerald-500/50 rounded-2xl p-6 text-center cursor-pointer bg-[#0B0F14] transition-colors group"
              >
                <input
                  type="file"
                  ref={fileInputRef}
                  accept=".csv"
                  onChange={handleFileUpload}
                  className="hidden"
                />
                <i data-lucide="file-spreadsheet" className="w-8 h-8 text-emerald-400 mx-auto mb-2 group-hover:scale-110 transition-transform"></i>
                <p className="text-xs font-bold text-white">Click to Upload .CSV File</p>
                <p className="text-[10px] text-slate-400 mt-1">Columns: Date, Description, Category, Amount, Type</p>
              </div>

              {/* Sample CSV Format Helper */}
              <div className="p-3 rounded-xl bg-[#0E131A] border border-[#1E2633] text-[11px] space-y-1">
                <span className="font-mono text-slate-400 block text-[10px] uppercase font-bold">CSV Structure:</span>
                <p className="font-mono text-emerald-400">Date,Description,Category,Amount,Type</p>
                <p className="font-mono text-slate-500">01-08-2026,Client Retainer,Income,125000,income</p>
              </div>

              {parsedPreview.length > 0 && (
                <div className="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-xs font-mono text-emerald-300">
                  ✓ {parsedPreview.length} rows parsed and ready to import into active dashboard!
                </div>
              )}

              <div className="flex gap-2 pt-2">
                <button
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl bg-[#18202C] text-xs font-semibold text-slate-300"
                >
                  Cancel
                </button>
                <button
                  onClick={handleConfirm}
                  disabled={parsedPreview.length === 0}
                  className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-slate-950 font-bold text-xs"
                >

              </div>
            </div>
          </div>
        </div>
      );

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
          <div className="w-full max-w-md bg-[#11161F] border border-[#1E2633] rounded-3xl shadow-modal overflow-hidden p-6 space-y-4">
            <h3 className="text-sm font-bold text-white">Record Transaction</h3>
            <form onSubmit={handleSubmit} className="space-y-3">
              <div className="grid grid-cols-2 gap-2 p-1 bg-[#0B0F14] rounded-xl border border-[#1E2633]">
                <button
                  type="button"
                  onClick={() => setType('expense')}
                  className={`py-1.5 rounded-lg text-xs font-bold ${type === 'expense' ? 'bg-rose-500/20 text-rose-400' : 'text-slate-400'}`}
                >
                  Expense
                </button>
                <button
                  type="button"
                  onClick={() => setType('income')}
                  className={`py-1.5 rounded-lg text-xs font-bold ${type === 'income' ? 'bg-emerald-500/20 text-emerald-400' : 'text-slate-400'}`}
                >
                  Income
                </button>
              </div>

              <div>
                <label className="text-xs text-slate-400 block mb-1">Description</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. AWS Cloud, Salary, Groceries"
                  value={desc}
                  onChange={(e) => setDesc(e.target.value)}
                  className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-slate-400 block mb-1">Amount ({currency})</label>
                  <input
                    type="number"
                    step="0.01"
                    required
                    placeholder="0.00"
                    value={amount}
                    onChange={(e) => setAmount(e.target.value)}
                    className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white font-mono font-bold focus:outline-none focus:border-emerald-500"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400 block mb-1">Category</label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    disabled={type === 'income'}
                    className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                  >
                    <option value="Bills & Utilities">Bills & Utilities</option>
                    <option value="Food & Groceries">Food & Groceries</option>
                    <option value="Shopping & Lifestyle">Shopping & Lifestyle</option>
                    <option value="Investments">Investments</option>
                    <option value="Travel & Commute">Travel & Commute</option>
                    <option value="Other & Health">Other & Health</option>
                  </select>
                </div>
              </div>

              <div className="flex gap-2 pt-3">
                <button type="button" onClick={onClose} className="flex-1 py-2 rounded-xl bg-[#18202C] text-xs font-semibold text-slate-300">
                  Cancel
                </button>
                <button type="submit" className="flex-1 py-2 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs">
                  Save Entry
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- MOUNT REACT APPLICATION ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CashXFlowMultiUserApp />);
  </script>
</body>
</html>
