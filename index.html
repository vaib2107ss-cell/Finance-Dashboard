    // --- CLEAN RUPEE (₹) FORMATTER (Not in Lakhs, Clean & Legible) ---
    function formatMoney(amount, currency = 'INR', compact = false) {
      const absVal = Math.abs(amount || 0);
      const isNegative = (amount || 0) < 0;
      const sign = isNegative ? '-' : '';

      if (compact && absVal >= 1000) {
        return `${sign}₹${(absVal / 1000).toFixed(1)}k`;
      }

      return `${sign}₹${new Intl.NumberFormat('en-IN', {
        maximumFractionDigits: 0
      }).format(absVal)}`;
    }

    // --- MAIN MULTI-USER DASHBOARD APP ---
    function CashXFlowApp() {
      const [currentUser, setCurrentUser] = useState(null); // null = Login screen
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup'
      const [showPassword, setShowPassword] = useState(false);

      // Data Stores (2 users + dynamic users)
      const [users, setUsers] = useState(INITIAL_USERS);
      const [accountsByUser, setAccountsByUser] = useState(INITIAL_ACCOUNTS);
      const [transactionsByUser, setTransactionsByUser] = useState(INITIAL_TRANSACTIONS);
      const [holdingsByUser, setHoldingsByUser] = useState(INITIAL_HOLDINGS);

      // Workspace States
      const [currentView, setCurrentView] = useState('dashboard'); // 'dashboard' | 'analytics' | 'investments' | 'transactions'
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedAccount, setSelectedAccount] = useState('all');
      const [userSwitcherOpen, setUserSwitcherOpen] = useState(false);

      // Modals
      const [isAddAccountModalOpen, setIsAddAccountModalOpen] = useState(false);
      const [isAddTxnModalOpen, setIsAddTxnModalOpen] = useState(false);
      const [isTradeModalOpen, setIsTradeModalOpen] = useState(false);
      const [isCsvModalOpen, setIsCsvModalOpen] = useState(false);
      const [isTransferModalOpen, setIsTransferModalOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3200);
      };

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Active User Slice
      const activeAccounts = useMemo(() => {
        return currentUser ? (accountsByUser[currentUser.id] || []) : [];
      }, [currentUser, accountsByUser]);

      const activeTransactions = useMemo(() => {
        return currentUser ? (transactionsByUser[currentUser.id] || []) : [];
      }, [currentUser, transactionsByUser]);

      const activeHoldings = useMemo(() => {
        return currentUser ? (holdingsByUser[currentUser.id] || []) : [];
      }, [currentUser, holdingsByUser]);

      // Computed Financial Metrics
      const totalBalance = useMemo(() => {
        return activeAccounts.reduce((sum, a) => sum + a.balance, 0);
      }, [activeAccounts]);

      const totalInvestments = useMemo(() => {
        return activeHoldings.reduce((sum, h) => sum + (h.value || (h.shares * h.price)), 0);
      }, [activeHoldings]);

      const netWorth = useMemo(() => {
        return totalBalance + totalInvestments;
      }, [totalBalance, totalInvestments]);

      const monthlyIncome = useMemo(() => {
        return activeTransactions
          .filter(t => t.type === 'income')
          .reduce((sum, t) => sum + t.amount, 0);
      }, [activeTransactions]);

      const monthlyExpenses = useMemo(() => {
        return activeTransactions
          .filter(t => t.type === 'expense')
          .reduce((sum, t) => sum + Math.abs(t.amount), 0);
      }, [activeTransactions]);

      const netCashFlow = monthlyIncome - monthlyExpenses;
      const savingsRate = monthlyIncome > 0 ? +((netCashFlow / monthlyIncome) * 100).toFixed(0) : 0;

      // Dynamic Category Breakdown
      const spendingCategories = useMemo(() => {
        const catMap = {};
        const colors = ["#3B82F6", "#10B981", "#8B5CF6", "#06B6D4", "#F59E0B", "#EC4899", "#64748B"];
        let colorIdx = 0;

        activeTransactions.filter(t => t.type === 'expense').forEach(t => {
          catMap[t.category] = (catMap[t.category] || 0) + Math.abs(t.amount);
        });

        const totalExpense = monthlyExpenses || 1;
        return Object.keys(catMap).map(catName => {
          const amt = catMap[catName];
          const pct = +((amt / totalExpense) * 100).toFixed(0);
          const item = {
            name: catName,
            amount: amt,
            percentage: pct,
            color: colors[colorIdx % colors.length]
          };
          colorIdx++;
          return item;
        }).sort((a, b) => b.amount - a.amount);
      }, [activeTransactions, monthlyExpenses]);

      // Add New Bank Account Action
      const handleAddAccount = (newAcc) => {
        if (!currentUser) return;
        const fullAcc = {
          id: `acc-${currentUser.id}-${Date.now()}`,
          ...newAcc
        };

        setAccountsByUser(prev => ({
          ...prev,
          [currentUser.id]: [...(prev[currentUser.id] || []), fullAcc]
        }));

        setIsAddAccountModalOpen(false);
        showToast(`Added ${newAcc.name} to ${currentUser.name}'s accounts!`);
      };

      // Add Transaction Action
      const handleAddTransaction = (newTxn) => {
        if (!currentUser) return;
        setTransactionsByUser(prev => ({
          ...prev,
          [currentUser.id]: [newTxn, ...(prev[currentUser.id] || [])]
        }));
        setAccountsByUser(prev => ({
          ...prev,
          [currentUser.id]: prev[currentUser.id].map(acc => {
            if (acc.name === newTxn.account) {
              return { ...acc, balance: acc.balance + newTxn.amount };
            }
            return acc;
          })
        }));
        setIsAddTxnModalOpen(false);
        showToast("Transaction saved to ledger!");
      };

      // Execute Trade Action (Buy/Sell in Investments)
      const handleTrade = ({ symbol, action, shares, price, total }) => {
        const cost = parseFloat(total);
        if (!currentUser) return;

        if (action === 'BUY') {
          // Deduct from first checking account
          setAccountsByUser(prev => ({
            ...prev,
            [currentUser.id]: prev[currentUser.id].map((acc, idx) => idx === 0 ? { ...acc, balance: acc.balance - cost } : acc)
          }));
          setHoldingsByUser(prev => {
            const list = prev[currentUser.id] || [];
            const exists = list.find(h => h.symbol === symbol);
            if (exists) {
              const newShares = exists.shares + parseFloat(shares);
              const newValue = newShares * price;
              return {
                ...prev,
                [currentUser.id]: list.map(h => h.symbol === symbol ? { ...h, shares: newShares, value: newValue } : h)
              };
            } else {
              return {
                ...prev,
                [currentUser.id]: [...list, { symbol, name: symbol, shares: parseFloat(shares), avg: price, price, value: cost, pnl: 0, pnlPct: 0, type: 'Equity' }]
              };
            }
          });
          showToast(`Bought ${shares} units of ${symbol} for ${formatMoney(cost)}!`);
        } else {
          setAccountsByUser(prev => ({
            ...prev,
            [currentUser.id]: prev[currentUser.id].map((acc, idx) => idx === 0 ? { ...acc, balance: acc.balance + cost } : acc)
          }));
          setHoldingsByUser(prev => ({
            ...prev,
            [currentUser.id]: (prev[currentUser.id] || []).map(h => {
              if (h.symbol === symbol) {
                const newShares = Math.max(0, h.shares - parseFloat(shares));
                return { ...h, shares: newShares, value: newShares * price };
              }
              return h;
            })
          }));
          showToast(`Sold ${shares} units of ${symbol} for ${formatMoney(cost)}!`);
        }
        setIsTradeModalOpen(false);
      };

      // Switch Profile
      const handleSwitchUser = (userId) => {
        const u = users.find(x => x.id === userId);
        if (u) {
          setCurrentUser(u);
          setSelectedAccount('all');
          setUserSwitcherOpen(false);
          showToast(`Switched to ${u.name}`);
        }
      };

      // -------------------------------------------------------------
      // 1. AUTH SCREEN (With Eye Password Toggle & 2 Demo Users)
      // -------------------------------------------------------------
      if (!currentUser) {
        return (
          <div className="min-h-screen w-screen bg-[#0B0F14] bg-mesh-glow flex flex-col items-center justify-center p-4">
            <div className="w-full max-w-md space-y-6">

                  ₹
                </div>
                <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                  CASH<span className="text-emerald-400">X</span>FLOW
                </h1>
                <p className="text-xs sm:text-sm text-slate-400">
                  Smart Multi-User Cash Flow Management
                </p>
              </div>

              {/* Login / Sign Up Card */}
              <div className="glass-card rounded-3xl p-6 sm:p-8 border border-[#1E2633] shadow-modal space-y-6">
                <div className="flex p-1 bg-[#0B0F14] rounded-xl border border-[#1E2633] text-xs font-semibold">
                  <button
                    onClick={() => setAuthMode('login')}
                    className={`flex-1 py-2 rounded-lg transition-all ${
                      authMode === 'login' ? 'bg-[#1E2633] text-emerald-400 shadow-sm' : 'text-slate-400'
                    }`}
                  >
                    Sign In
                  </button>
                  <button
                    onClick={() => setAuthMode('signup')}
                    className={`flex-1 py-2 rounded-lg transition-all ${
                      authMode === 'signup' ? 'bg-[#1E2633] text-emerald-400 shadow-sm' : 'text-slate-400'
                    }`}
                  >
                    Create Account
                  </button>
                </div>

                {authMode === 'login' ? (
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      handleSwitchUser(101);
                    }}
                    className="space-y-4"
                  >
                    <div>
                      <label className="text-xs font-semibold text-slate-300 block mb-1.5">Email Address</label>
                      <input
                        type="email"
                        defaultValue="vaibhav@cashxflow.io"
                        required
                        className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    {/* Password with Eye View Toggle Button */}
                    <div>
                      <label className="text-xs font-semibold text-slate-300 block mb-1.5">Password</label>
                      <div className="relative">
                        <input
                          type={showPassword ? 'text' : 'password'}
                          defaultValue="password123"
                          required
                          className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl pl-3 pr-10 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                        />
                        <button
                          type="button"
                          onClick={() => setShowPassword(!showPassword)}
                          className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors"
                          title={showPassword ? "Hide Password" : "Show Password"}
                        >
                          <i data-lucide={showPassword ? "eye-off" : "eye"} className="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs shadow-md transition-colors"
                    >
                      Sign In to CASHXFLOW
                    </button>
                  </form>
                ) : (
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      const name = e.target.name.value;
                      const email = e.target.email.value;
                      const newId = 100 + users.length + 1;
                      const newUser = { id: newId, name, email, password: "password123", currency: "INR", role: "Personal Account", avatar: name.slice(0,2).toUpperCase(), location: "India" };
                      setUsers([...users, newUser]);
                      setAccountsByUser({ ...accountsByUser, [newId]: [{ id: `acc-${newId}-1`, name: "Primary Savings", type: "Savings", number: "••• 1001", balance: 25000, color: "#10B981", badge: "Primary" }] });
                      setTransactionsByUser({ ...transactionsByUser, [newId]: [] });
                      setHoldingsByUser({ ...holdingsByUser, [newId]: [] });
                      setCurrentUser(newUser);
                      showToast(`Welcome, ${name}!`);
                    }}
                    className="space-y-4"
                  >
                    <div>
                      <label className="text-xs font-semibold text-slate-300 block mb-1.5">Full Name</label>
                      <input
                        name="name"
                        type="text"
                        required
                        placeholder="e.g. Ankit Sharma"
                        className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-300 block mb-1.5">Email Address</label>
                      <input
                        name="email"
                        type="email"
                        required
                        placeholder="name@domain.com"
                        className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-300 block mb-1.5">Password</label>
                      <div className="relative">
                        <input
                          type={showPassword ? 'text' : 'password'}
                          required
                          placeholder="••••••••"
                          className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl pl-3 pr-10 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                        />
                        <button

                        className="px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold"
                      >
                        + Add Record
                      </button>
                    </div>

                    <div className="overflow-x-auto mt-3">
                      <table className="w-full text-left text-xs">
                        <thead>
                          <tr className="border-b border-[#1E2633] text-[10px] font-mono uppercase text-slate-400">
                            <th className="py-3 px-3">Description</th>
                            <th className="py-3 px-3">Category</th>
                            <th className="py-3 px-3">Account</th>
                            <th className="py-3 px-3">Date</th>
                            <th className="py-3 px-3 text-right">Amount</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-[#1E2633]/50">
                          {activeTransactions.slice(0, 6).map(t => (
                            <tr key={t.id} className="hover:bg-[#161D29]/80 transition-colors">
                              <td className="py-3 px-3 font-semibold text-slate-200">{t.desc}</td>
                              <td className="py-3 px-3 text-slate-400">{t.category}</td>
                              <td className="py-3 px-3 font-mono text-slate-400 text-[11px]">{t.account}</td>
                              <td className="py-3 px-3 font-mono text-slate-400 text-[11px]">{t.date}</td>
                              <td className={`py-3 px-3 text-right font-mono font-bold ${t.type === 'income' ? 'text-emerald-400' : 'text-slate-200'}`}>
                                {t.type === 'income' ? '+' : ''}{formatMoney(t.amount)}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW 2: FULL ANALYTICS SECTION */}
              {currentView === 'analytics' && (
                <div className="space-y-6">
                  <div className="bg-[#11161F] border border-[#1E2633] p-5 rounded-2xl">
                    <h2 className="text-xl font-bold text-white">Financial Analytics & Expense Breakdown</h2>
                    <p className="text-xs text-slate-400 mt-1">Detailed cash flow velocity and optimization metrics for {currentUser.name}.</p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="glass-card rounded-2xl p-4 border border-[#1E2633]">
                      <p className="text-xs text-slate-400 uppercase font-mono">Monthly Surplus</p>
                      <h3 className="text-2xl font-bold text-emerald-400 font-mono mt-1">+{formatMoney(netCashFlow)}</h3>
                      <p className="text-[11px] text-slate-400 mt-1">Savings Rate: {savingsRate}%</p>
                    </div>
                    <div className="glass-card rounded-2xl p-4 border border-[#1E2633]">
                      <p className="text-xs text-slate-400 uppercase font-mono">Burn Runway</p>
                      <h3 className="text-2xl font-bold text-white font-mono mt-1">{(totalBalance / (monthlyExpenses || 1)).toFixed(1)} Months</h3>
                      <p className="text-[11px] text-slate-400 mt-1">At {formatMoney(monthlyExpenses)}/mo burn</p>
                    </div>
                    <div className="glass-card rounded-2xl p-4 border border-[#1E2633]">
                      <p className="text-xs text-slate-400 uppercase font-mono">Total Liquid Cash</p>
                      <h3 className="text-2xl font-bold text-blue-400 font-mono mt-1">{formatMoney(totalBalance)}</h3>
                      <p className="text-[11px] text-slate-400 mt-1">{activeAccounts.length} Bank Vaults</p>
                    </div>
                    <div className="glass-card rounded-2xl p-4 border border-[#1E2633]">
                      <p className="text-xs text-slate-400 uppercase font-mono">Investment Pool</p>
                      <h3 className="text-2xl font-bold text-purple-400 font-mono mt-1">{formatMoney(totalInvestments)}</h3>
                      <p className="text-[11px] text-slate-400 mt-1">{activeHoldings.length} Assets</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="glass-card rounded-2xl p-5 border border-[#1E2633] space-y-4">
                      <h3 className="text-sm font-bold text-white">Expense Distribution by Category</h3>
                      <div className="space-y-3">
                        {spendingCategories.map(cat => (
                          <div key={cat.name} className="p-3 rounded-xl bg-[#0B0F14] border border-[#1E2633] flex justify-between items-center">
                            <div>
                              <p className="text-xs font-semibold text-slate-200">{cat.name}</p>
                              <p className="text-[10px] text-slate-400 font-mono">{cat.percentage}% of total outflow</p>
                            </div>
                            <span className="text-xs font-mono font-bold text-white">{formatMoney(cat.amount)}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="glass-card rounded-2xl p-5 border border-[#1E2633] space-y-4">
                      <h3 className="text-sm font-bold text-white">Smart Optimization Insights</h3>
                      <div className="p-3.5 rounded-xl bg-[#0B0F14] border border-[#1E2633] space-y-1">
                        <span className="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
                          <i data-lucide="trending-down" className="w-3.5 h-3.5"></i>
                          Healthy Savings Buffer
                        </span>
                        <p className="text-xs text-slate-300">
                          You retain {savingsRate}% of your monthly income (+{formatMoney(netCashFlow)}). Consider investing an extra {formatMoney(5000)} monthly into your index fund.
                        </p>
                      </div>

                      <div className="p-3.5 rounded-xl bg-[#0B0F14] border border-[#1E2633] space-y-1">
                        <span className="text-xs font-bold text-blue-400 flex items-center gap-1.5">
                          <i data-lucide="shield-check" className="w-3.5 h-3.5"></i>
                          Runway Cushion
                        </span>
                        <p className="text-xs text-slate-300">
                          Your liquid balance of {formatMoney(totalBalance)} comfortably covers {(totalBalance / (monthlyExpenses || 1)).toFixed(1)} months of living expenses.
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW 3: FULL INVESTMENTS SECTION */}
              {currentView === 'investments' && (
                <div className="space-y-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-[#11161F] border border-[#1E2633] p-5 rounded-2xl">
                    <div>
                      <h2 className="text-xl font-bold text-white">Investment Portfolio & Holdings</h2>
                      <p className="text-xs text-slate-400 mt-1">Live asset allocation and trade execution for {currentUser.name}.</p>
                    </div>
                    <div className="flex items-center gap-4">
                      <div className="text-right">
                        <span className="text-xs text-slate-400 font-mono">Portfolio Valuation</span>
                        <h3 className="text-2xl font-extrabold text-white font-mono">{formatMoney(totalInvestments)}</h3>
                      </div>
                      <button
                        onClick={() => setIsTradeModalOpen(true)}
                        className="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs flex items-center gap-1.5 shadow-md"
                      >
                        <i data-lucide="trending-up" className="w-4 h-4"></i>
                        <span>Trade / Rebalance</span>
                      </button>
                    </div>
                  </div>

                  <div className="glass-card rounded-2xl border border-[#1E2633] overflow-hidden">
                    <div className="p-4 border-b border-[#1E2633] flex justify-between items-center">
                      <h3 className="text-sm font-bold text-white">Active Positions</h3>
                      <span className="text-xs font-mono text-emerald-400">{activeHoldings.length} Assets Held</span>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-[#0E131A] border-b border-[#1E2633] text-[10px] font-mono uppercase text-slate-400">
                          <tr>
                            <th className="py-3 px-4">Symbol & Name</th>
                            <th className="py-3 px-4">Asset Type</th>
                            <th className="py-3 px-4">Units / Shares</th>
                            <th className="py-3 px-4">Avg Buy (₹)</th>
                            <th className="py-3 px-4">Live Price (₹)</th>
                            <th className="py-3 px-4 text-right">Total Value (₹)</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-[#1E2633]/60">
                          {activeHoldings.map(h => (
                            <tr key={h.symbol} className="hover:bg-[#161D29] transition-colors">
                              <td className="py-3.5 px-4 font-semibold text-white">
                                <span className="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-emerald-400 font-mono text-xs mr-2">
                                  {h.symbol}
                                </span>
                                {h.name}
                              </td>
                              <td className="py-3.5 px-4 font-mono text-slate-400">{h.type}</td>
                              <td className="py-3.5 px-4 font-mono text-slate-200">{h.shares}</td>
                              <td className="py-3.5 px-4 font-mono text-slate-400">₹{h.avg.toFixed(2)}</td>
                              <td className="py-3.5 px-4 font-mono font-bold text-white">₹{h.price.toFixed(2)}</td>
                              <td className="py-3.5 px-4 font-mono font-bold text-right text-emerald-400">
                                {formatMoney(h.value || (h.shares * h.price))}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW 4: TRANSACTIONS VIEW */}
              {currentView === 'transactions' && (
                <div className="glass-card rounded-2xl p-5 border border-[#1E2633] space-y-4">
                  <div className="flex justify-between items-center pb-4 border-b border-[#1E2633]/60">
                    <h2 className="text-xl font-bold text-white">Transactions Ledger — {currentUser.name}</h2>
                    <button
                      onClick={() => setIsAddTxnModalOpen(true)}
                      className="px-3 py-1.5 rounded-lg bg-emerald-500 text-slate-950 font-bold text-xs"
                    >
                      + Add Record
                    </button>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-[#1E2633] text-[10px] font-mono uppercase text-slate-400">
                          <th className="py-3 px-3">Description</th>
                          <th className="py-3 px-3">Category</th>
                          <th className="py-3 px-3">Account</th>
                          <th className="py-3 px-3">Date</th>
                          <th className="py-3 px-3 text-right">Amount</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1E2633]/50">
                        {activeTransactions.map(t => (
                          <tr key={t.id} className="hover:bg-[#161D29]/80 transition-colors">
                            <td className="py-3 px-3 font-semibold text-slate-200">{t.desc}</td>
                            <td className="py-3 px-3 text-slate-400">{t.category}</td>
                            <td className="py-3 px-3 font-mono text-slate-400 text-[11px]">{t.account}</td>
                            <td className="py-3 px-3 font-mono text-slate-400 text-[11px]">{t.date}</td>
                            <td className={`py-3 px-3 text-right font-mono font-bold ${t.type === 'income' ? 'text-emerald-400' : 'text-slate-200'}`}>
                              {t.type === 'income' ? '+' : ''}{formatMoney(t.amount)}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* ADD BANK ACCOUNT MODAL */}
          {isAddAccountModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div className="w-full max-w-md bg-[#11161F] border border-[#1E2633] rounded-3xl shadow-modal p-6 space-y-4">
                <div className="flex justify-between items-center pb-3 border-b border-[#1E2633]">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <i data-lucide="plus-circle" className="w-4 h-4 text-emerald-400"></i>
                    Add Bank Account / Vault
                  </h3>
                  <button onClick={() => setIsAddAccountModalOpen(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const name = e.target.name.value;
                    const type = e.target.type.value;
                    const balance = parseFloat(e.target.balance.value) || 0;
                    const number = "••• " + (Math.floor(1000 + Math.random() * 9000));
                    handleAddAccount({ name, type, balance, number, color: "#10B981", badge: type });
                  }}
                  className="space-y-3"
                >
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Account / Bank Name</label>
                    <input
                      name="name"
                      type="text"
                      required
                      placeholder="e.g. Kotak 811 Savings or SBI Vault"
                      className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">Account Type</label>
                      <select
                        name="type"
                        className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                      >
                        <option value="Savings">Savings</option>
                        <option value="Checking">Checking / Salary</option>
                        <option value="Fixed Deposit">Fixed Deposit</option>
                        <option value="Credit Card">Credit Card</option>
                        <option value="Demat">Demat Pool</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">Opening Balance (₹)</label>
                      <input
                        name="balance"
                        type="number"
                        step="0.01"
                        required
                        placeholder="25000"
                        className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white font-mono font-bold focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>

                  <div className="flex gap-2 pt-3">
                    <button type="button" onClick={() => setIsAddAccountModalOpen(false)} className="flex-1 py-2 rounded-xl bg-[#18202C] text-xs font-semibold text-slate-300">
                      Cancel
                    </button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs">
                      Save Account
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* RECORD TRANSACTION MODAL */}
          {isAddTxnModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div className="w-full max-w-md bg-[#11161F] border border-[#1E2633] rounded-3xl shadow-modal p-6 space-y-4">
                <div className="flex justify-between items-center pb-3 border-b border-[#1E2633]">
                  <h3 className="text-sm font-bold text-white">Record Transaction (₹)</h3>
                  <button onClick={() => setIsAddTxnModalOpen(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const desc = e.target.desc.value;
                    const amount = parseFloat(e.target.amount.value) || 0;
                    const type = e.target.type.value;
                    const category = type === 'income' ? 'Income' : e.target.category.value;
                    const account = e.target.account.value;

                    handleAddTransaction({
                      id: `TXN-${Date.now()}`,
                      date: "Aug 31, 2026",
                      desc,
                      category,
                      account,
                      amount: type === 'income' ? amount : -amount,
                      type,
                      status: "Completed"
                    });
                  }}
                  className="space-y-3"
                >
                  <div className="grid grid-cols-2 gap-2 p-1 bg-[#0B0F14] rounded-xl border border-[#1E2633]">
                    <select
                      name="type"
                      className="col-span-2 bg-transparent text-xs text-emerald-400 font-bold p-1 text-center focus:outline-none"
                    >
                      <option value="expense" className="bg-[#11161F] text-rose-400">Expense Outflow (−)</option>
                      <option value="income" className="bg-[#11161F] text-emerald-400">Income Inflow (+)</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Description</label>
                    <input
                      name="desc"
                      type="text"
                      required
                      placeholder="e.g. Electricity, Groceries, Freelance"
                      className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">Amount (₹)</label>
                      <input
                        name="amount"
                        type="number"
                        step="0.01"
                        required
                        placeholder="2500"
                        className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white font-mono font-bold focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">Category</label>
                      <select
                        name="category"
                        className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                      >
                        <option value="Bills & Utilities">Bills & Utilities</option>
                        <option value="Food & Groceries">Food & Groceries</option>
                        <option value="Shopping & Lifestyle">Shopping & Lifestyle</option>
                        <option value="Investments">Investments</option>
                        <option value="Travel & Commute">Travel & Commute</option>
                        <option value="Other & Health">Other & Health</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Charged Account</label>
                    <select
                      name="account"
                      className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 font-mono"
                    >
                      {activeAccounts.map(acc => (
                        <option key={acc.id} value={acc.name}>{acc.name} ({formatMoney(acc.balance)})</option>
                      ))}
                    </select>
                  </div>

                  <div className="flex gap-2 pt-3">
                    <button type="button" onClick={() => setIsAddTxnModalOpen(false)} className="flex-1 py-2 rounded-xl bg-[#18202C] text-xs font-semibold text-slate-300">
                      Cancel
                    </button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs">
                      Save Record
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* TRADE ORDER MODAL (INVESTMENTS) */}
          {isTradeModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div className="w-full max-w-md bg-[#11161F] border border-[#1E2633] rounded-3xl shadow-modal p-6 space-y-4">
                <div className="flex justify-between items-center pb-3 border-b border-[#1E2633]">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <i data-lucide="trending-up" className="w-4 h-4 text-emerald-400"></i>
                    Execute Stock / ETF Trade
                  </h3>
                  <button onClick={() => setIsTradeModalOpen(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const symbol = e.target.symbol.value;
                    const action = e.target.action.value;
                    const shares = parseFloat(e.target.shares.value) || 0;
                    const asset = activeHoldings.find(h => h.symbol === symbol) || { price: 250 };
                    const total = shares * asset.price;
                    handleTrade({ symbol, action, shares, price: asset.price, total });
                  }}
                  className="space-y-3"
                >
                  <div className="grid grid-cols-2 gap-2 p-1 bg-[#0B0F14] rounded-xl border border-[#1E2633]">
                    <select name="action" className="col-span-2 bg-transparent text-xs text-emerald-400 font-bold p-1 text-center focus:outline-none">
                      <option value="BUY" className="bg-[#11161F] text-emerald-400">Buy Position</option>
                      <option value="SELL" className="bg-[#11161F] text-rose-400">Sell Position</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Select Asset</label>
                    <select name="symbol" className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white font-mono">
                      {activeHoldings.map(h => (
                        <option key={h.symbol} value={h.symbol}>{h.symbol} — {h.name} (₹{h.price.toFixed(2)})</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Units / Quantity</label>
                    <input
                      name="shares"
                      type="number"
                      step="any"
                      required
                      defaultValue="5"
                      className="w-full bg-[#0B0F14] border border-[#1E2633] rounded-xl px-3 py-2 text-xs text-white font-mono font-bold focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="flex gap-2 pt-3">
                    <button type="button" onClick={() => setIsTradeModalOpen(false)} className="flex-1 py-2 rounded-xl bg-[#18202C] text-xs font-semibold text-slate-300">
                      Cancel
                    </button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs">
                      Confirm Trade
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- MOUNT APP ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CashXFlowApp />);
  </script>
</body>
</html>
